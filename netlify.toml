[build]
  # This is the single public app address. Keep the verified immutable runtime
  # in netlify-gateway/_redirects current on every release. Keeping
  # the Netlify origin preserves its localStorage, IndexedDB and installed PWA.
  # Do not publish a second independently ageing copy of the Vite build here.
  command = "node -e \"console.log('Serving Amari at dinospace.netlify.app')\""
  publish = "netlify-gateway"
